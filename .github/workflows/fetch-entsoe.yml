name: Fetch ENTSO-E data

on:
  schedule:
    - cron: "23 13 * * *"   # every day, 13:23 UTC (after day-ahead results are published)
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write            # lets the job commit the updated CSV files

concurrency:
  group: fetch-entsoe
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340     # the first run backfills from 2021 and can take a few hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download from ENTSO-E
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python src/fetch_entsoe.py

      - name: Commit updated data
        if: always()         # keep partial progress even if the script stopped early
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            git push
          fi
