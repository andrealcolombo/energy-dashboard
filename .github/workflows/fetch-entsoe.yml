name: Fetch ENTSO-E data

on:
  schedule:
    - cron: "23 13 * * *"   # every day, 13:23 UTC (after day-ahead results are published)
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write            # lets the job commit the updated CSV files

concurrency:
  group: fetch-entsoe
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Prices every day; generation mix and load only on Sundays (or when run by hand),
      # since they move slowly and are ready for the Monday update of the app.
      - name: Weekly or daily?
        id: when
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "weekly=true" >> "$GITHUB_OUTPUT"
          else
            echo "weekly=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/commit.sh <<'SH'
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(date -u +%Y-%m-%d) ($1)"
          git pull --rebase -X ours origin main || true
          git push
          SH
          chmod +x /tmp/commit.sh

      # Each part is committed as soon as it finishes, so a slow or failed part
      # never throws away what the others downloaded.
      - name: Day-ahead prices
        timeout-minutes: 120
        run: python -u src/fetch_entsoe.py prices
      - name: Commit prices
        if: always()
        run: /tmp/commit.sh prices

      - name: Generation per type
        if: always() && steps.when.outputs.weekly == 'true'
        timeout-minutes: 150
        run: python -u src/fetch_entsoe.py generation
      - name: Commit generation
        if: always() && steps.when.outputs.weekly == 'true'
        run: /tmp/commit.sh generation

      - name: Load
        if: always() && steps.when.outputs.weekly == 'true'
        timeout-minutes: 100
        run: python -u src/fetch_entsoe.py load
      - name: Commit load
        if: always() && steps.when.outputs.weekly == 'true'
        run: /tmp/commit.sh load

      - name: EC Weekly Oil Bulletin
        if: always() && steps.when.outputs.weekly == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python src/fetch_oil_bulletin.py
      - name: Build dashboard files
        if: always()
        continue-on-error: true
        run: python src/build_dashboard_files.py
      - name: Commit oil bulletin and dashboard files
        if: always()
        run: /tmp/commit.sh "oil bulletin, dashboard files"
