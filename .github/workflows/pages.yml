name: Publish public website

# Builds the public site from app/ and the public data, and deploys it to GitHub Pages.
# Runs after each data update, after changes to the site, or by hand.
on:
  workflow_run:
    workflows: ["Fetch ENTSO-E data"]
    types: [completed]
  push:
    branches: [main]
    paths: ["app/**", "site/**", "src/build_excel.py"]
  workflow_dispatch:

permissions:
  contents: write   # pushes the built site to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Excel workbook
        run: python src/build_excel.py
      - name: Build site
        run: python site/build_site.py _site
      - name: Push site to the gh-pages branch (GitHub Pages serves it)
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
